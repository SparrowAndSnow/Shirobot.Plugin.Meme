name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PUBLISH_DIR: bin/Release/net10.0/publish

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish ShiroBot.MemePlugin.csproj --configuration Release

      - name: Verify exported contracts and single-file dependencies
        run: dotnet run --project Tests/ContractConsumer -c Release -- "$PUBLISH_DIR/ShiroBot.MemePlugin.dll"

      - name: Package plugin ZIP
        shell: bash
        run: |
          PLUGIN_DLL="$PUBLISH_DIR/ShiroBot.MemePlugin.dll"
          if [ ! -f "$PLUGIN_DLL" ]; then
            echo "Missing release asset: $PLUGIN_DLL"
            ls -la "$PUBLISH_DIR"
            exit 1
          fi

          unexpected_dlls=()
          for dll in "$PUBLISH_DIR"/*.dll; do
            [ -e "$dll" ] || continue
            if [ "$dll" != "$PLUGIN_DLL" ]; then
              unexpected_dlls+=("$dll")
            fi
          done
          if [ "${#unexpected_dlls[@]}" -ne 0 ]; then
            echo "Publish output contains unexpected DLLs:"
            printf '%s\n' "${unexpected_dlls[@]}"
            exit 1
          fi

          mkdir -p release
          cp "$PLUGIN_DLL" release/
          cd release
          zip -9 ShiroBot.MemePlugin.zip ShiroBot.MemePlugin.dll
          unzip -l ShiroBot.MemePlugin.zip

      - name: Upload plugin ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/ShiroBot.MemePlugin.zip
